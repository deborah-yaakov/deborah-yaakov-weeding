<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deborah & Yaakov</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f5ebdf;
      font-family: Georgia, serif;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .menu-wrapper {
      position: relative;
    }

    .menu-link {
      position: absolute;
      left: 20%;
      width: 60%;
      height: 10%;
      cursor: pointer;
      z-index: 5;
    }

    .houppa-link {
      top: 34%;
    }

    .response-link {
      top: 53%;
    }

    .rsvp {
      background: #f5ebdf;
      min-height: 100vh;
      padding: 70px 8% 100px;
      color: #b78a45;
    }

    .rsvp h2 {
      text-align: center;
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .rsvp .subtitle {
      text-align: center;
      margin-bottom: 45px;
      font-style: italic;
      color: #9f743b;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid #c8a66f;
      background: #f5ebdf;
      border-radius: 6px;
      font-size: 17px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .radio-line {
      display: flex;
      gap: 28px;
      margin-top: 8px;
    }

    button {
      display: block;
      margin: 35px auto 0;
      padding: 14px 42px;
      border: none;
      background: #b78a45;
      color: white;
      font-size: 19px;
      border-radius: 6px;
      cursor: pointer;
    }

    .thanks {
      display: none;
      text-align: center;
      margin-top: 25px;
      color: #9f743b;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      .rsvp h2 {
        font-size: 34px;
      }

      .rsvp {
        padding-left: 7%;
        padding-right: 7%;
      }
    } /* ===== PAGE D'ENTRÉE ===== */
#intro-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(248, 239, 227, 0.97);
  backdrop-filter: blur(4px);
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

#intro-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-box {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.intro-logo {
  width: min(78vw, 320px);
  max-width: 320px;
  display: block;
  margin: 0 auto 28px;
  opacity: 0;
  transform: translateY(18px);
  animation: introFadeUp 0.9s ease forwards;
  animation-delay: 0.05s;
}

.intro-date {
  margin-bottom: 22px;
  font-size: 16px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #b38a52;
  opacity: 0;
  transform: translateY(18px);
  animation: introFadeUp 0.9s ease forwards;
  animation-delay: 0.25s;
}

.intro-countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 0 auto 26px;
  opacity: 0;
  transform: translateY(18px);
  animation: introFadeUp 0.9s ease forwards;
  animation-delay: 0.45s;
}

.intro-card {
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(179, 138, 82, 0.28);
  border-radius: 16px;
  padding: 14px 8px;
}

.intro-number {
  display: block;
  font-size: 24px;
  line-height: 1;
  color: #9b7443;
}

.intro-label {
  display: block;
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #b38a52;
}

.intro-button {
  appearance: none;
  border: none;
  background: linear-gradient(135deg, #d8b273, #b88a4a);
  color: #fff;
  padding: 14px 28px;
  border-radius: 999px;
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(184, 138, 74, 0.18);
  opacity: 0;
  transform: translateY(18px);
  animation: introFadeUp 0.9s ease forwards;
  animation-delay: 0.65s;
}

@keyframes introFadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 480px) {
  .intro-countdown {
    gap: 8px;
  }

  .intro-card {
    padding: 12px 6px;
    border-radius: 14px;
  }

  .intro-number {
    font-size: 21px;
  }

  .intro-label {
    font-size: 10px;
  }
}
    .houppa-page {
  position: relative;
}

.waze-address-link {
  position: absolute;
  left: 26%;
  top: 55%;
  width: 48%;
  height: 10%;
  z-index: 10;
  cursor: pointer;
}

.waze-address-link::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: 5%;
  height: 1px;
  background: #b78a45;
  opacity: 0.75;
}
  </style>
</head>

<body>
<div id="intro-overlay">
  <div class="intro-box">

    <img
      src="Logo-dy.png.PNG"
      alt="Logo Deborah et Yaakov"
      class="intro-logo"
    >

    <div class="intro-date">02.11.2026</div>

    <div class="intro-countdown">
      <div class="intro-card">
        <span class="intro-number" id="days">00</span>
        <span class="intro-label">Jours</span>
      </div>

      <div class="intro-card">
        <span class="intro-number" id="hours">00</span>
        <span class="intro-label">Heures</span>
      </div>

      <div class="intro-card">
        <span class="intro-number" id="minutes">00</span>
        <span class="intro-label">Minutes</span>
      </div>

      <div class="intro-card">
        <span class="intro-number" id="seconds">00</span>
        <span class="intro-label">Secondes</span>
      </div>
    </div>

    <button id="openInvitationBtn" class="intro-button">
      Ouvrir l’invitation
    </button>

  </div>
</div>
  <section class="page">
    <img src="Design sans titre.png" alt="Bienvenue Deborah et Yaakov">
  </section>

  <section class="page menu-wrapper">
    <img src="25C24DFB-B14D-412C-A717-5432C18E0C26.png" alt="Menu invitation">

    <a class="menu-link houppa-link" href="#houppa"></a>
    <a class="menu-link response-link" href="#reponse"></a>
  </section>

  <section class="page houppa-page" id="houppa">
  <img src="8AB33913-A498-4240-9E5A-CF789240556F.png"
       alt="Houppa et réception">

  <a
    class="waze-address-link"
    href="https://www.waze.com/live-map/directions/%D7%A2%D7%9C%D7%9E%D7%94%2C-%D7%91%D7%99%D7%AA-%D7%90%D7%99%D7%A8%D7%95%D7%A2%D7%99%D7%9D-%D7%A9%D7%99%D7%96%D7%A3-3-%D7%90%D7%91%D7%9F-%D7%99%D7%94%D7%95%D7%93%D7%94?to=place.w.22872387.228658332.20387"
    target="_blank"
    rel="noopener"
    aria-label="Ouvrir Salle Alma dans Waze">
  </a>
</section>

  <section class="rsvp" id="reponse">

    <h2>Votre réponse</h2>

    <p class="subtitle">
      Merci de confirmer votre présence dès réception.
    </p>

    <form action="https://formsubmit.co/nonoche00@gmail.com" method="POST">

      <input type="hidden" name="_subject" value="Nouvelle réponse mariage Deborah & Yaakov">
      <input type="hidden" name="_captcha" value="false">

      <div class="form-group">
        <label>Prénom *</label>
        <input type="text" name="Prénom" required>
      </div>

      <div class="form-group">
        <label>Nom de famille *</label>
        <input type="text" name="Nom" required>
      </div>

      <div class="form-group">
        <label>Assistera(ont) à la Houppa & Réception le 2 novembre 2026 ? *</label>

        <div class="radio-line">
          <label>
            <input type="radio" name="Présence" value="Oui" required>
            Oui
          </label>

          <label>
            <input type="radio" name="Présence" value="Non">
            Non
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Nombre de personnes présentes</label>
        <input type="number" name="Nombre de personnes" min="1">
      </div>

      <div class="form-group">
        <label>Laissez-nous un message</label>
        <textarea name="Message"></textarea>
      </div>

      <button type="submit">Envoyer</button>

    </form>

  </section>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const overlay = document.getElementById("intro-overlay");
  const openBtn = document.getElementById("openInvitationBtn");

  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  const targetDate = new Date("2026-11-02T19:30:00");

  document.body.style.overflow = "hidden";

  function updateCountdown() {
    const now = new Date();
    let diff = targetDate - now;

    if (diff < 0) diff = 0;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    daysEl.textContent = String(days).padStart(2, "0");
    hoursEl.textContent = String(hours).padStart(2, "0");
    minutesEl.textContent = String(minutes).padStart(2, "0");
    secondsEl.textContent = String(seconds).padStart(2, "0");
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);

  openBtn.addEventListener("click", function () {
    overlay.classList.add("hidden");
    document.body.style.overflow = "";

    setTimeout(function () {
      overlay.remove();
      clearInterval(timer);
    }, 650);
  });
});
</script>
</body>
</html>
